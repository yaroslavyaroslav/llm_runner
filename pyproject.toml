[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "llm_runner"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-test = true

[tool.maturin.generate-ci.github.musllinux]

[tool.maturin.generate-ci.github.windows]

[tool.maturin.generate-ci.github.macos]

[[tool.maturin.generate-ci.github.linux.target]]
arch = "x86_64"

[[tool.maturin.generate-ci.github.linux.target]]
arch = "x86"

[[tool.maturin.generate-ci.github.linux.target]]
arch = "aarch64"
runner = "ubuntu-22.04-arm"

[[tool.maturin.generate-ci.github.linux.target]]
arch = "armv7"

[[tool.maturin.generate-ci.github.linux.target]]
arch = "s390x"

[[tool.maturin.generate-ci.github.linux.target]]
arch = "ppc64le"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"  # or class, module, package, or session
